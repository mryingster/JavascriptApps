<!DOCTYPE html>

<html>
  <head>
    <title>HEX Dump</title>
    <meta charset="utf-8"/>
    <link rel="stylesheet" type="text/css" media="screen" href="hex.css">
    <script src="hex.js"></script>
  </head>
  <body>
    <div id="content">
      <h1>HEX Dump</h1>

      <div id="settings">
        <input type="checkbox" id="colorize" /><label for="colorize">Colorize</label>

        <br>

        <label for="startOffset">Start Offset</label>
        <input id="startOffset" value="0x0"></input>

        <br>

        <label for="groupWidth">Byte Grouping</label>
        <select id="groupWidth">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
        </select>

        <br>

        <label for="byteWidth">Bytes Per Line</label>
        <select id="byteWidth">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16" selected>16</option>
          <option value="17">17</option>
          <option value="18">18</option>
          <option value="19">19</option>
          <option value="20">20</option>
          <option value="21">21</option>
          <option value="22">22</option>
          <option value="23">23</option>
          <option value="24">24</option>
          <option value="25">25</option>
          <option value="26">26</option>
          <option value="27">27</option>
          <option value="28">28</option>
          <option value="29">29</option>
          <option value="30">30</option>
          <option value="31">31</option>
          <option value="32">32</option>
        </select>

        <br>

        <input type="file" id="fileInput" accept="*" class="hidden"></input>
        <label id="upload" for="fileInput">Upload File</label>

      </div>

      <div id="hexWrapper">
        <span id="hextitle"></span>
        <span id="hexsize"></span>

        <div id="hexviewer">
          <div class="results" id="hexline"></div>
	  <div class="results" id="hexdata"></div>
          <div class="results" id="ascii"></div>
        </div>
      </div>

    </div>
  </body>
</html>
