<html>
  <head>
    <title>Hue're Adorable</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=555, user-scalable=no" />
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" type="text/css" media="screen" href="style.css">
    <script src="/apps/shared/confetti.js"></script>
    <script src="huey.js"></script>
  </head>
  <body>
    <div id="content">
      <div id="header">
	<h1>Hue're Adorable</h1>
	<span id="score_container">Moves:<span id="moves">-</span></span>
      </div>
      <div id="canvas_wrapper">
	<canvas class="game_canvas" id="buffer"  width="512px" height="512px"></canvas>
	<canvas class="game_canvas" id="canvas"  width="512px" height="512px"></canvas>
	<canvas class="game_canvas" id="overlay" width="512px" height="512px"></canvas>
      </div>
      <div id="controls">
	<button id="btn_newgame">New Game</button>

        <div class="grouped_controls">
	  <label for="width">Width:</label>
	  <select id="width">
            <option>4</option>
            <option selected>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
	  </select>
          <br>
	  <label for="height">Height:</label>
	  <select id="height">
            <option>4</option>
            <option selected>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
	  </select>
        </div>

	<div class="grouped_controls">
          <input type="checkbox" id="subgradient", value="subgradient"><label for="subgradient">Hard Mode</label>
          <br>
	  <span id="sharespan"><a href="#" id="share" title="Copy to share!"><img id="share_icon" src="icons/share.svg">Permalink</a></span>
        </div>
      </div>
      <div id="game_over" class="hidden">
        <img src="icons/close.svg" id="close">
        <p>Congratulations! You solved it in <span id="go_moves"></span> moves!</p>
        <button id="btn_stats">See Stats</button>
        <button id="btn_replay">Replay</button>
        <button id="btn_newgame2">New Game</button>
      </div>
      <div id="debug">
	<h2>Debug</h2>
	<button id="btn_debug_generate">Create</button>
	<button id="btn_debug_shuffle">Shuffle</button>
	<p>DEBUG:<span id="debug_msg"></span></p>
      </div>
    </div>
  </body>
</html>
