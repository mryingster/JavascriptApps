<!DOCTYPE html>
<html
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Steganography</title>
    <link rel="stylesheet" type="text/css" media="screen" href="style.css">
    <script src="steno.js"></script>
  </head>

  <body onload="first_run();" onresize="">
    <div id="content">
      <div id="header">
        <h1>Steganography</h1>
        <p>Encode a hidden image in an image, or try to find one.</p>
      </div>

      <div class="canvasContainer">
        <h3>Base Image</h3>
        <canvas id="input_base_canvas"></canvas>
        <br>
        <input type="file" id="load"/>
      </div>

      <div class="canvasContainer">
        <h3>Hidden Image</h3>
        <canvas id="input_message_canvas"></canvas>
        <br>
        <input type="file" id="load"/>
      </div>

      <div class="canvasContainer">
        <h3>Combined</h3>
        <canvas id="output_canvas"></canvas>
        <br>
        <button onclick="save();">Save</button>
      </div>

      <h3>Options</h3>

      <label for="bits">Significant Bits</label>
      <select id="bits">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>

      <br>

      <label for="channel">Channel(s)</label>
      <select id="channel">
        <option value="red">Red</option>
        <option value="green">Green</option>
        <option value="blue">Blue</option>
        <option value="all" selected>All</option>
      </select>

    </div>
  </body>

  <script>

// comment

document.getElementById('load').addEventListener('change', load, false);

let loaded = false;

function load(e){
    // Get image from user & Load it into main canvas
    var reader = new FileReader();
    reader.onload = function(event){
        var img = new Image();
        img.onload = function() {
            load_image("input_canvas", img);
        }
        img.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
}

function load_image(canvas_name, image){
    let canvas = document.getElementById(canvas_name);
    let ctx = canvas.getContext("2d");

    // Resize
    canvas.width = image.width;
    canvas.height = image.height;

    // Clear the canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw!
    ctx.drawImage(image, 0, 0);

    // Mark as loaded
    if (canvas == "depth_canvas")
        depth_loaded = true;
    if (canvas == "tile_canvas")
        tile_loaded = true;

    // Try rendering
    generate();
}

function generate() {
    let base_canvas = document.getElementById("input_base_canvas")
    let base_ctx = base_canvas.getContext("2d");

    let message_canvas = document.getElementById("input_message_canvas")
    let message_ctx = message_canvas.getContext("2d");

    let output_canvas = document.getElementById("output_canvas")
    let output_ctx = output_canvas.getContext("2d");

    // Resize output canvas to match input canvas
    output_canvas.width  = base_canvas.width
    output_canvas.height = base_canvas.height

    // Get options
    const bits = Number(document.getElementById("bits").value);
    const mask = (0xFF << bits) & 0xFF;
    const scale = (0x01 << bits);
    console.log(mask, scale)
    const channel = document.getElementById("channel").value.toLowerCase();

    // Read through our input canvas 1 pixel at a time
    let base      = base_ctx.getImageData(0,    0, base_canvas.width,    base_canvas.height);
    let message   = message_ctx.getImageData(0, 0, message_canvas.width, message_canvas.height);
    let output    = output_ctx.getImageData(0,  0, output_canvas.width,  output_canvas.height);

    for (let i=0; i<base.data.length; i+=4){
        const br = base.data[i + 0];
        const bg = base.data[i + 1];
        const bb = base.data[i + 2];
        const ba = base.data[i + 3];

        // Normalize message data to number of bits we have
        const mr = Math.floor(scale / 256 * message.data[i + 0]);
        const mg = Math.floor(scale / 256 * message.data[i + 1]);
        const mb = Math.floor(scale / 256 * message.data[i + 2]);

        if (i == 0)
            console.log(br, mr, br & mask, (br & mask) + mr);

	if (channel == "all") {
            output.data[i + 0] = (br & mask) + mr;
            output.data[i + 1] = (bg & mask) + mg;
            output.data[i + 2] = (bb & mask) + mb;
	} else {
	    output.data[i + 0] = br;
            output.data[i + 1] = bg;
            output.data[i + 2] = bb;

	    if (channel == "red")
		output.data[i + 0] = (br & mask) + mr;

	    if (channel == "green")
		output.data[i + 1] = (bg & mask) + mg;

	    if (channel == "blue")
		output.data[i + 2] = (bb & mask) + mb;
	}

        output.data[i + 3] = ba;
    }

    // Write it back out
    output_ctx.putImageData(output, 0, 0);
}

function save() {
    window.open(document.getElementById("output_canvas").toDataURL('image/png'));
}

function first_run() {
    // Connect Inputs
    document.getElementById("bits").onchange = () => { generate() };
    document.getElementById("channel").onchange = () => { generate() };

    // Load sample images
    let imageBase = new Image();
    imageBase.onload = function() {
        load_image("input_base_canvas", imageBase);
    }
    imageBase.src = "sample.jpg";

    let imageMessage = new Image();
    imageMessage.onload = function() {
        load_image("input_message_canvas", imageMessage);
    }
    imageMessage.src = "hidden.png";
}

first_run();

  </script>
</html>
