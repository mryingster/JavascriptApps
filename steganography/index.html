<!DOCTYPE html>
<html
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Steganography</title>
    <link rel="stylesheet" type="text/css" media="screen" href="style.css">
    <script src="steganography.js"></script>
  </head>

  <body onload="first_run();" onresize="">
    <div id="content">
      <div id="header">
        <h1>Steganography</h1>
        <p>Encode a hidden image in an image, or try to find one.</p>
      </div>


      <div id="left" class="main_third">
        <div id="inputdiv">
          <h3>Base Image</h3>
          <canvas id="base_canvas"></canvas>
          <br>
          <input type="file" id="load_base"/>
          <br>
          <button id="save_base">Save</button>
        </div>

        <br>

        <div id="inputdiv">
          <h3>Hidden Image</h3>
          <canvas id="hidden_canvas"></canvas>
          <br>
          <input type="file" id="load_hidden"/>
          <br>
          <button id="save_hidden">Save</button>
        </div>
      </div>

      <div id="middle" class="main_third">
        <h3>Mode</h3>
        <button id="toggle_mode">Encode</button>

        <h3>Options</h3>

        <label for="bits">Significant Bits</label>
        <select id="bits">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>

        <br>

        <label for="channel">Channel(s)</label>
        <select id="channel">
          <option value="red">Red</option>
          <option value="green">Green</option>
          <option value="blue">Blue</option>
          <option value="all" selected>All</option>
        </select>
      </div>

      <div id="right" class="main_third">
        <div id="outputdiv">
          <h3>Combined</h3>
          <canvas id="combined_canvas"></canvas>
          <br>
          <input type="file" id="load_combined"/>
          <br>
          <button id="save_combined">Save</button>
        </div>
      </div>

    </div>
  </body>
</html>
